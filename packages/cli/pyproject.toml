[project]
name = "lauschkiste-cli"
version = "0.1.0"
description = "Jukebox CLI"
requires-python = ">=3.11"
dependencies = [
  "typer",
  "websockets",
  "python-dotenv",
  "lauschkiste",
]

[tool.uv]
package = true

[tool.uv.sources]
lauschkiste = { workspace = true }

[project.scripts]
jukebox = "lauschkiste_cli.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lauschkiste_cli"]
