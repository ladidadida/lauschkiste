[project]
name = "lauschkiste-core"
# Keep in sync with src/lauschkiste/version.py
version = "0.1.0a4.dev2"
description = "Lauschkiste core: player, library, cards, volume, timers and the web API of the RFID audio player"
license = "MIT"
requires-python = ">=3.11"
readme = "README.md"
authors = [{ name = "the Lauschkiste contributors" }]
keywords = [
  "rfid",
  "music player",
  "audiobooks",
  "kids",
  "raspberry pi",
  "home automation",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Sound/Audio :: Players",
  "Topic :: Home Automation",
]
license-files = ["LICENSE"]
dependencies = [
  "evdev",
  "mutagen",
  "pulsectl",
  "ruamel.yaml",
  "requests",
  "fastapi",
  "packaging",
  "pydantic>=2",
  "uvicorn",
  # Default player backend (player.backend: local_audio): decode via ffmpeg-bundled wheels (no
  # system ffmpeg needed, wheels exist for x86_64/aarch64/armv7l), output via PortAudio.
  "av",
  # piwheels: newer av for Python 3.11 on 32-bit ARM is built against Trixie's ffmpeg 7, Bookworm has 5
  "av<13.1; python_version < '3.12' and (platform_machine == 'armv6l' or platform_machine == 'armv7l')",
  "sounddevice",
  # audioop (fast PCM volume scaling) left the standard library in Python 3.13
  "audioop-lts; python_version >= '3.13'",
]

[project.urls]
Homepage = "https://github.com/ladidadida/lauschkiste"
Documentation = "https://github.com/ladidadida/lauschkiste/tree/main/documentation"
Issues = "https://github.com/ladidadida/lauschkiste/issues"
Changelog = "https://github.com/ladidadida/lauschkiste/releases"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lauschkiste"]
# The web app build, copied in by ci/build_wheels.sh (ignored by git, so listed explicitly)
artifacts = ["src/lauschkiste/webapp/**"]

[tool.hatch.build.targets.sdist]
# A wheel built from the sdist has the web app too
artifacts = ["src/lauschkiste/webapp/**"]

