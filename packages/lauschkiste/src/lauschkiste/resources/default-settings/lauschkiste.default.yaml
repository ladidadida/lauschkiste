# Relative paths are relative to the home directory ($LAUSCHKISTE_HOME, see `lauschctl home`).
system:
  box_name: Lauschkiste
  # Seconds between system.health events (CPU temperature, disk usage); 0 disables them
  health_interval_sec: 10
  # espeak voice for system.say_my_ip
  speech_voice: en
# Plugins to load, each with its settings. Installed plugins are only loaded when listed here.
# See documentation/developers/core-and-plugins.md
plugins: {}
# Example: Raspberry Pi hardware control (the installer enables it on a Pi)
# plugins:
#   raspberry_pi:
#     debug_mode: false          # log shutdown/reboot instead of doing them
#     hdmi_power_down: false
#     wlan_power_save: false     # false: keep WLAN reachable
#     gpio:
#       enabled: true
#       buttons:
#         next: {pin: 5, action: player.next}
#         play: {pin: 6, action: player.toggle, hold_action: {action: raspberry_pi.shutdown}, hold_time: 3}
#       rotary_encoders:
#         volume:
#           pin_a: 17
#           pin_b: 27
#           clockwise: {action: volume.change_volume, args: {step: 2}}
#           counter_clockwise: {action: volume.change_volume, args: {step: -2}}
#       status_led: 25
#     battery:
#       enabled: false
#       driver: ina219
#
# Example: play through an external mpd server (also set player.backend: mpd)
# plugins:
#   mpd:
#     host: localhost
#     status_file: settings/music_player_status.json
#     library:
#       update_on_startup: true
#       check_user_rights: true
volume:
  # 'auto': PulseAudio/PipeWire if a server is reachable, otherwise the player backend's volume.
  # 'pulse' or 'player' force one of them.
  mixer: auto
  # Volume after start (comment out to keep the current volume)
  startup_volume: 40
  # Limit of the volume that can be set (0-100); can be changed in the web app
  soft_max_volume: 70
  # Outputs to switch between (PulseAudio/PipeWire sinks). Leave pulse_sink_name of the first
  # output empty to use the system's default sink. `wpctl status` lists the sinks.
  # volume_limit scales 0..100 to 0..volume_limit for this output.
  outputs:
    primary:
      alias: Built-in speakers
      volume_limit: 100
      # pulse_sink_name: alsa_output.pci-0000_00_1f.3.analog-stereo
    # secondary:
    #   alias: Bluetooth headset
    #   volume_limit: 100
    #   pulse_sink_name: bluez_sink.C4_FB_20_63_CO_FE.a2dp_sink
jingle:
  # Supported: anything the player can decode (wav, mp3, flac, ...)
  startup_sound: default
  # Not played on Ctrl-C
  shutdown_sound: default
  # Playback volume of the jingles in percent of the current output volume
  volume: 30
player:
  # Which playback backend to use. 'local_audio' (default) plays files directly via PyAV/sounddevice,
  # no external player/daemon needed -- works on any Linux box with the normal audio output.
  # 'mpd' delegates to an external mpd server instead (requires the mpd plugin, see plugins: above,
  # and a running mpd instance).
  backend: local_audio
  second_swipe_action:
    # One of: 'toggle', 'play', 'skip', 'rewind', 'replay', 'replay_if_stopped', 'none'
    alias: toggle
    # Or any action instead, e.g.:
    # action: player.next
    # args: {}
  # Must be one of: 'none', 'stop', 'rewind':
  end_of_playlist_next_action: none
  # Must be one of: 'none', 'prev', 'rewind':
  stopped_prev_action: prev
  # Must be one of: 'none', 'next', 'rewind':
  stopped_next_action: next
  # Playback volume in percent (0-100) of the local_audio backend, on top of the system volume.
  # Keep it at 100 when PulseAudio/PipeWire controls the volume (volume.mixer). mpd keeps its own
  # volume (see mpd_client.setvol), unrelated to this.
  volume: 100
audiobooks:
  # Each folder in library/audiobooks is an audiobook; it continues where it stopped, going back
  # rewind_sec seconds
  rewind_sec: 10
library:
  # The library, with music/ and audiobooks/ below
  path: library
  # Index of the library (tags, durations) and extracted cover art
  index: settings/library.sqlite
  cover_cache: cache/covers
  scan_on_startup: true
  # Rescan automatically after files were added, changed or removed outside the web app
  # (Samba, USB stick, ...), once the library has been quiet for watch_interval_sec
  watch: true
  watch_interval_sec: 5
api:
  # 0.0.0.0 (all interfaces): nginx used to be the only thing reachable from the LAN, reverse
  # proxying to a loopback-only API server. There is no separate reverse proxy anymore -- this
  # server (webapp static files + /api/*) needs to be reachable directly.
  bind_address: 0.0.0.0
  port: 5556
rfid:
  reader_config: settings/rfid.yaml
cards:
  database: settings/cards.yaml
timers:
  # Named timers run an action when they expire. Defaults (can be overridden here):
  #   stop_player: player.stop, fade_volume: volume.fade_out, shutdown: raspberry_pi.shutdown
  # (the shutdown timer needs the raspberry-pi plugin).
  stop_player:
    default_timeout_sec: 3600
  fade_volume:
    default_timeout_sec: 600
  shutdown:
    default_timeout_sec: 3600
input:
  # Play/pause/next/previous/volume keys of any input device (e.g. a Bluetooth headset or a
  # keyboard). Off by default so Lauschkiste doesn't react to a desktop keyboard's media keys.
  media_keys: false
  # USB buttons, joysticks, keyboards: device name and key -> action, e.g.
  # devices:
  #   joystick:
  #     device_name: DragonRise Inc.   Generic   USB
  #     exact: false
  #     keys:
  #       BTN_TRIGGER: {action: player.toggle}
  #       BTN_THUMB: {action: volume.change_volume, args: {step: 5}}
  devices: {}
sync_rfidcards:
  enable: false
  config_file: settings/sync_rfidcards.yaml
webapp:
  # Cover art cache of the mpd plugin
  coverart_cache_path: cache/mpd-covers
  # Load cover arts in Webapp. Change to false in case you have performance issue
  # when handling a lot of music
  # Defaults to true
  show_covers: true
