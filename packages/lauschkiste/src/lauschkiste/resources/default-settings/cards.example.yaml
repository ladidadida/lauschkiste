# Card database: card id -> the action it triggers.
#
#   action: <module>.<action>     see GET /api/v1/actions for all available actions
#   args:   named arguments of that action
#   ignore_same_id_delay: true    card can re-trigger immediately (e.g. volume up)
#   ignore_card_removal_action: true
#
# Entries in the old format (alias or package/plugin/method) are converted automatically.
'0001234567':
  action: player.play_card
  args:
    folder: path/to/music/folder
'0001234568':
  action: player.play_album
  args:
    albumartist: Some Artist
    album: Some Album
'0001234569':
  action: player.toggle
'0001234570':
  action: player.next
  ignore_same_id_delay: true
  ignore_card_removal_action: true
