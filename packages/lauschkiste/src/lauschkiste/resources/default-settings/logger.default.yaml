version: 1
formatters:
  color:
    format: '{asctime} - {lineno:4}:{filename:18} - {name:30} - {threadName:15} - {levelnameColored:8} - {lightcyan}{message}{reset}'
    datefmt: '%d.%m.%Y %H:%M:%S'
    style: '{'
  base:
    format: '{asctime} - {lineno:4}:{filename:18} - {name:30} - {threadName:15} - {levelname:8} - {message}'
    datefmt: '%d.%m.%Y %H:%M:%S'
    style: '{'
handlers:
  console:
    class: logging.StreamHandler
    level: DEBUG
    formatter: color
    stream: ext://sys.stdout
    filters: [colorize]
  # Written only as system.log_files says (off, errors, all); see the system settings
  debug_file_handler:
    class: logging.handlers.RotatingFileHandler
    level: DEBUG
    formatter: base
    filename: logs/app.log
    maxBytes: 2097152 # 2 MB
    backupCount: 2
    encoding: utf8
    mode: w
  error_file_handler:
    class: logging.handlers.RotatingFileHandler
    level: WARNING
    formatter: base
    filename: logs/errors.log
    maxBytes: 1048576 # 1 MB
    backupCount: 2
    encoding: utf8
    mode: w
  publisher:
    # Publishes logging messages via the PublishServer
    "()": lauschkiste.common.loggingext.PubStreamHandler
    level: WARNING
    formatter: base
filters:
  colorize:
    # This filter adds all colors from simplecolors by using %(colorname)c or {colorname} in formatter string
    # It also adds the keyword {levelnameColored} which auto-colors the levelname depending on severity
    "()": lauschkiste.common.loggingext.ColorFilter
    enable: True
    color_levelname: True
loggers:
  lauschkiste:
    level: DEBUG
    handlers: [console, publisher, debug_file_handler, error_file_handler]
    # handlers: [console, publisher]
    # handlers: [console]
    propagate: false
  lauschkiste.audio.event:
    level: WARNING
  lauschkiste.daemon:
    level: DEBUG
  lauschkiste.plugin.call:
    level: DEBUG
  lauschkiste.pub.server:
    level: DEBUG
    # In case you recursion problems, make sure this logger does not go to the publisher
    # propagate: false
    # handlers: [console]
  urllib3:
    level: WARNING
root:
  level: WARNING
  handlers: [console, debug_file_handler, error_file_handler]
