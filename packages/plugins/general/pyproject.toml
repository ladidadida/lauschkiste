[project]
name = "lauschkiste-plugins"
version = "0.1.0a8"
description = "Lauschkiste plugins: computers as devices, RFID readers, Samba, Audiobookshelf, podcast and radio directories"
license = "MIT"
requires-python = ">=3.11"
readme = "README.md"
authors = [{ name = "the Lauschkiste contributors" }]
keywords = [
  "lauschkiste",
  "plugin",
  "rfid",
  "nfc",
  "audiobookshelf",
  "samba",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Hardware",
  "Topic :: Home Automation",
]
license-files = ["LICENSE"]
dependencies = [
  "lauschkiste-core==0.1.0a8",
  "lauschkiste==0.1.0a8",
  "requests",
]

[project.urls]
Homepage = "https://github.com/ladidadida/lauschkiste"
Documentation = "https://github.com/ladidadida/lauschkiste/tree/main/documentation"
Issues = "https://github.com/ladidadida/lauschkiste/issues"
Changelog = "https://github.com/ladidadida/lauschkiste/releases"

[project.optional-dependencies]
# Dependencies of the individual RFID drivers; generic_usb needs none beyond the core.
# rc522_spi includes pi-rc522-gpiozero (no PyPI release); these are its dependencies.
rc522-spi = [
  "gpiozero",
  "spidev",
  # gpiozero's pin backend on kernels >= 6.6, where /sys/class/gpio/ is gone
  "lgpio; platform_machine == 'armv6l' or platform_machine == 'armv7l' or platform_machine == 'aarch64'",
]
mfrc522-i2c = ["mfrc522_i2c"]
pn532-i2c-py532 = ["py532lib"]
rdm6300-serial = ["pyserial"]
generic-nfcpy = ["nfcpy"]

[project.entry-points."lauschkiste.plugins"]
rfid_generic_usb = "lauschkiste_plugin_rfid_readers:GenericUsb"
rfid_rdm6300_serial = "lauschkiste_plugin_rfid_readers:Rdm6300Serial"
rfid_rc522_spi = "lauschkiste_plugin_rfid_readers:Rc522Spi"
rfid_mfrc522_i2c = "lauschkiste_plugin_rfid_readers:Mfrc522I2c"
rfid_pn532_i2c_py532 = "lauschkiste_plugin_rfid_readers:Pn532I2cPy532"
rfid_generic_nfcpy = "lauschkiste_plugin_rfid_readers:GenericNfcpy"
device_pc_test = "lauschkiste_plugin_device_pc:DevicePcTest"
device_pc_box = "lauschkiste_plugin_device_pc:DevicePcBox"
samba = "lauschkiste_plugin_samba:Samba"
audiobookshelf = "lauschkiste_plugin_audiobookshelf:Audiobookshelf"
podcast_directories = "lauschkiste_plugin_directories:PodcastDirectories"
radio_directories = "lauschkiste_plugin_directories:RadioDirectories"

[tool.uv.sources]
lauschkiste-core = { workspace = true }
lauschkiste = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "src/lauschkiste_plugin_audiobookshelf",
  "src/lauschkiste_plugin_device_pc",
  "src/lauschkiste_plugin_directories",
  "src/lauschkiste_plugin_rfid_readers",
  "src/lauschkiste_plugin_samba",
]
