[project]
name = "lauschkiste-plugin-directories"
version = "0.1.0a4.dev2"
description = "Lauschkiste plugin: find podcasts and radio stations in online directories"
license = "MIT"
requires-python = ">=3.11"
readme = "README.md"
authors = [{ name = "the Lauschkiste contributors" }]
keywords = [
  "lauschkiste",
  "plugin",
  "podcasts",
  "radio",
  "directory",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Sound/Audio :: Players",
  "Topic :: Home Automation",
]
license-files = ["LICENSE"]
dependencies = [
  "lauschkiste-core==0.1.0a4.dev2",
  "requests",
]

[project.urls]
Homepage = "https://github.com/ladidadida/lauschkiste"
Documentation = "https://github.com/ladidadida/lauschkiste/tree/main/documentation"
Issues = "https://github.com/ladidadida/lauschkiste/issues"
Changelog = "https://github.com/ladidadida/lauschkiste/releases"

[project.entry-points."lauschkiste.plugins"]
podcast_directories = "lauschkiste_plugin_directories:PodcastDirectories"
radio_directories = "lauschkiste_plugin_directories:RadioDirectories"

[tool.uv.sources]
lauschkiste-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lauschkiste_plugin_directories"]
