[project]
name = "lauschkiste-plugin-rfid-readers"
version = "0.1.0a3"
description = "Lauschkiste plugins: RFID reader drivers (one plugin per driver)"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "lauschkiste",
]

[project.optional-dependencies]
# Dependencies of the individual drivers; generic_usb needs none beyond the core.
# rc522_spi includes pi-rc522-gpiozero (no PyPI release); these are its dependencies.
rc522-spi = [
  "gpiozero",
  "spidev",
  # gpiozero's pin backend on kernels >= 6.6, where /sys/class/gpio/ is gone
  "lgpio; platform_machine == 'armv6l' or platform_machine == 'armv7l' or platform_machine == 'aarch64'",
]
mfrc522-i2c = ["mfrc522_i2c"]
pn532-i2c-py532 = ["py532lib"]
rdm6300-serial = ["pyserial"]
generic-nfcpy = ["nfcpy"]
fake-reader-gui = ["ttkthemes"]

[project.entry-points."lauschkiste.plugins"]
rfid_generic_usb = "lauschkiste_plugin_rfid_readers:GenericUsb"
rfid_fake_reader_gui = "lauschkiste_plugin_rfid_readers:FakeReaderGui"
rfid_rdm6300_serial = "lauschkiste_plugin_rfid_readers:Rdm6300Serial"
rfid_rc522_spi = "lauschkiste_plugin_rfid_readers:Rc522Spi"
rfid_mfrc522_i2c = "lauschkiste_plugin_rfid_readers:Mfrc522I2c"
rfid_pn532_i2c_py532 = "lauschkiste_plugin_rfid_readers:Pn532I2cPy532"
rfid_generic_nfcpy = "lauschkiste_plugin_rfid_readers:GenericNfcpy"

[tool.uv.sources]
lauschkiste = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lauschkiste_plugin_rfid_readers"]
