[project]
name = "jukebox-plugin-raspberry-pi"
version = "1.0.0"
description = "Jukebox plugin: Raspberry Pi hardware control (power, GPIO, battery, health)"
requires-python = ">=3.11"
dependencies = [
  "jukebox",
]

[project.optional-dependencies]
gpio = [
  "gpiozero",
  # gpiozero's pin backend on kernels >= 6.6, where /sys/class/gpio/ is gone
  "lgpio; platform_machine == 'armv6l' or platform_machine == 'armv7l' or platform_machine == 'aarch64'",
]
battery-ina219 = ["pi-ina219"]

[project.entry-points."jukebox.plugins"]
raspberry_pi = "jukebox_plugin_raspberry_pi:RaspberryPi"

[tool.uv.sources]
jukebox = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jukebox_plugin_raspberry_pi"]
