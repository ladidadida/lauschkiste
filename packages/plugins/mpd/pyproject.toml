[project]
name = "lauschkiste-plugin-mpd"
version = "0.1.0a2"
description = "Lauschkiste plugin: player backend using an external MPD server"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "lauschkiste",
  "python-mpd2",
]

[project.entry-points."lauschkiste.plugins"]
mpd = "lauschkiste_plugin_mpd:Mpd"

[tool.uv.sources]
lauschkiste = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lauschkiste_plugin_mpd"]
