[project]
name = "lauschkiste-plugin-devices"
version = "0.1.0a4.dev2"
description = "Lauschkiste device plugins: GPIO buttons/encoders/LED, battery monitor, power button (board-independent)"
license = "MIT"
requires-python = ">=3.11"
readme = "README.md"
authors = [{ name = "the Lauschkiste contributors" }]
keywords = [
  "lauschkiste",
  "plugin",
  "gpio",
  "battery",
  "led",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Hardware",
  "Topic :: Home Automation",
]
license-files = ["LICENSE"]
dependencies = [
  "lauschkiste-core==0.1.0a4.dev2",
]

[project.urls]
Homepage = "https://github.com/ladidadida/lauschkiste"
Documentation = "https://github.com/ladidadida/lauschkiste/tree/main/documentation"
Issues = "https://github.com/ladidadida/lauschkiste/issues"
Changelog = "https://github.com/ladidadida/lauschkiste/releases"

[project.optional-dependencies]
gpio = [
  "gpiozero",
  # gpiozero's backend for Linux GPIO chips (any board, Raspberry Pi kernels >= 6.6)
  "lgpio; platform_machine == 'armv6l' or platform_machine == 'armv7l' or platform_machine == 'aarch64'",
]
battery = ["pi-ina219", "smbus2"]

[project.entry-points."lauschkiste.plugins"]
gpio_controls = "lauschkiste_plugin_devices.gpio_controls:GpioControls"
battery = "lauschkiste_plugin_devices.battery:Battery"
power_button = "lauschkiste_plugin_devices.power_button:PowerButton"
phat_beat = "lauschkiste_plugin_devices.phat_beat:PhatBeat"

[tool.uv.sources]
lauschkiste-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lauschkiste_plugin_devices"]
