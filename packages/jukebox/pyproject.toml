[project]
name = "jukebox"
# Not sourced from packages/jukebox/src/jukebox/version.py yet -- real packaging (installable
# wheel, version sourcing) is Track B in documentation/developers/roadmap-core-architecture.md,
# not this tooling migration.
version = "3.7.0"
description = "RFID-controlled audio jukebox for the Raspberry Pi (fork) -- Jukebox Core"
requires-python = ">=3.11"
dependencies = [
  "evdev",
  "mutagen",
  "pulsectl",
  "ruamel.yaml",
  "requests",
  "fastapi",
  "packaging",
  "pydantic>=2",
  "uvicorn",
  # Default player backend (player.backend: local_audio): decode via ffmpeg-bundled wheels (no
  # system ffmpeg needed, wheels exist for x86_64/aarch64/armv7l), output via PortAudio.
  "av",
  "sounddevice",
  # audioop (fast PCM volume scaling) left the standard library in Python 3.13
  "audioop-lts; python_version >= '3.13'",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jukebox"]
# The web app build, copied in by ci/build_wheels.sh (ignored by git, so listed explicitly)
artifacts = ["src/jukebox/webapp/**"]

