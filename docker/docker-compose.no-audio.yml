# Optional override for local dev without a host PulseAudio server: MPD gets a "null" audio
# output instead of streaming to host.docker.internal via Pulse, so `PULSE_SERVER` is no longer
# required. Backend/frontend/library browsing all still work; playback just produces no sound.
#
# Usage: docker compose -f docker-compose.yml -f docker-compose.no-audio.yml up
services:
  mpd:
    environment:
      - PULSE_SERVER=
    volumes:
      - ./config/docker.mpd.no-audio.conf:/root/.config/mpd/mpd.conf

  lauschkiste:
    environment:
      - PULSE_SERVER=
    volumes:
      - ./config/docker.mpd.no-audio.conf:/root/.config/mpd/mpd.conf
