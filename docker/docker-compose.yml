services:
  mpd:
    build:
      args:
        - UID=0
        - USER=root
        - HOME=/root
      context: ../
      dockerfile: ./docker/Dockerfile.mpd
    container_name: mpd
    image: phoniebox/mpd
    environment:
      - PULSE_SERVER=tcp:host.docker.internal:4713
    restart: unless-stopped
    volumes:
      - ../shared/audiofolders:/root/RPi-Jukebox-RFID/shared/audiofolders
      - ../shared/playlists:/root/.config/mpd/playlists
      - ./config/docker.mpd.conf:/root/.config/mpd/mpd.conf

  jukebox:
    build:
      args:
        - UID=0
        - USER=root
        - HOME=/root
      context: ../
      dockerfile: ./docker/Dockerfile.jukebox
    container_name: jukebox
    image: phoniebox/jukebox
    depends_on:
      - mpd
    environment:
      - PULSE_SERVER=tcp:host.docker.internal:4713
    ports:
      - 5556:5556
    restart: unless-stopped
    tty: true
    volumes:
      - ../packages/lauschkiste:/root/RPi-Jukebox-RFID/packages/lauschkiste
      - ../packages/cli:/root/RPi-Jukebox-RFID/packages/cli
      - ../packages/webapp/public/cover-cache:/root/RPi-Jukebox-RFID/packages/webapp/build/cover-cache
      - ../shared:/root/RPi-Jukebox-RFID/shared
      - ./config/docker.mpd.conf:/root/.config/mpd/mpd.conf
    command: jukebox run

  webapp:
    build:
      context: ../
      dockerfile: ./docker/Dockerfile.webapp
    container_name: webapp
    image: phoniebox/webapp
    depends_on:
      - jukebox
    environment:
      - CHOKIDAR_USEPOLLING=true
      - API_PROXY_TARGET=http://jukebox:5556
    ports:
      - 3000:3000
    restart: unless-stopped
    volumes:
      - ../packages/webapp:/home/node/webapp
      - /home/node/webapp/node_modules
