version: 1

cache:
  local:
    enabled: true
    path: .bam/cache

tasks:
  # ── Static checks ────────────────────────────────────────────────────────────

  lint:
    command: uv run ruff check packages/lauschkiste/src packages/cli/src packages/plugins test
    stage: lint
    inputs:
      - "packages/lauschkiste/src/**/*.py"
      - "packages/plugins/**/*.py"
      - "packages/cli/src/**/*.py"
      - "test/**/*.py"
      - pyproject.toml

  format:
    command: uv run ruff format packages/lauschkiste/src packages/cli/src packages/plugins test
    inputs:
      - "packages/lauschkiste/src/**/*.py"
      - "packages/plugins/**/*.py"
      - "packages/cli/src/**/*.py"
      - "test/**/*.py"
      - pyproject.toml

  format-check:
    # Informational only for now: the codebase has never been run through a formatter (ruff format
    # --check currently flags ~70 files), and applying it needs its own dedicated commit at a
    # moment that's acceptable for a large diff, not bundled into unrelated changes. See
    # documentation/developers/roadmap-core-architecture.md.
    command: uv run ruff format --check packages/lauschkiste/src packages/cli/src packages/plugins test || true
    stage: lint
    inputs:
      - "packages/lauschkiste/src/**/*.py"
      - "packages/plugins/**/*.py"
      - "packages/cli/src/**/*.py"
      - "test/**/*.py"
      - pyproject.toml

  typecheck:
    # Informational only for now: the codebase has never been type-checked (basic mode already
    # finds hundreds of pre-existing errors), so this must not block `ci-checks`/CI until that
    # backlog is worked down. See documentation/developers/roadmap-core-architecture.md.
    command: uv run pyright || true
    stage: lint
    inputs:
      - "packages/lauschkiste/src/**/*.py"
      - "packages/plugins/**/*.py"
      - "packages/cli/src/**/*.py"
      - pyproject.toml

  # ── Tests ─────────────────────────────────────────────────────────────────────

  test:
    command: uv run pytest --junit-xml=.reports/junit.xml
    stage: test
    inputs:
      - "packages/lauschkiste/src/**/*.py"
      - "packages/plugins/**/*.py"
      - "packages/cli/src/**/*.py"
      - "test/**/*.py"
      - pyproject.toml
    outputs:
      - .reports/junit.xml

  test-py311:
    # As in CI: its own Python in a container. The tests run in a copy, so nothing is written into the checkout.
    command: >-
      sh -c "apt-get update -qq && apt-get install -y -qq libportaudio2 libpulse0 > /dev/null &&
      mkdir /work && tar -c --exclude=node_modules --exclude=.venv --exclude=.git --exclude=.bam --exclude=dist
      --exclude=scratch --exclude=site --exclude=pi-test -f - . | tar -x -C /work && cd /work &&
      uv sync --locked --group dev --quiet && uv run pytest -q"
    stage: test
    runner:
      type: docker
      user: root
      image: ghcr.io/astral-sh/uv:python3.11-bookworm
    inputs:
      - "packages/**/*.py"
      - "packages/**/pyproject.toml"
      - "packages/lauschkiste/interfaces/**"
      - "packages/plugins/*/interfaces/**"
      - "packages/lauschkiste/src/lauschkiste/resources/**"
      - "test/**"
      - pyproject.toml
      - uv.lock

  test-py313:
    # As in CI: its own Python in a container. The tests run in a copy, so nothing is written into the checkout.
    command: >-
      sh -c "apt-get update -qq && apt-get install -y -qq libportaudio2 libpulse0 > /dev/null &&
      mkdir /work && tar -c --exclude=node_modules --exclude=.venv --exclude=.git --exclude=.bam --exclude=dist
      --exclude=scratch --exclude=site --exclude=pi-test -f - . | tar -x -C /work && cd /work &&
      uv sync --locked --group dev --quiet && uv run pytest -q"
    stage: test
    runner:
      type: docker
      user: root
      image: ghcr.io/astral-sh/uv:python3.13-bookworm
    inputs:
      - "packages/**/*.py"
      - "packages/**/pyproject.toml"
      - "packages/lauschkiste/interfaces/**"
      - "packages/plugins/*/interfaces/**"
      - "packages/lauschkiste/src/lauschkiste/resources/**"
      - "test/**"
      - pyproject.toml
      - uv.lock

  test-py314:
    # As in CI: its own Python in a container. The tests run in a copy, so nothing is written into the checkout.
    command: >-
      sh -c "apt-get update -qq && apt-get install -y -qq libportaudio2 libpulse0 > /dev/null &&
      mkdir /work && tar -c --exclude=node_modules --exclude=.venv --exclude=.git --exclude=.bam --exclude=dist
      --exclude=scratch --exclude=site --exclude=pi-test -f - . | tar -x -C /work && cd /work &&
      uv sync --locked --group dev --quiet && uv run pytest -q"
    stage: test
    runner:
      type: docker
      user: root
      image: ghcr.io/astral-sh/uv:python3.14-bookworm
    inputs:
      - "packages/**/*.py"
      - "packages/**/pyproject.toml"
      - "packages/lauschkiste/interfaces/**"
      - "packages/plugins/*/interfaces/**"
      - "packages/lauschkiste/src/lauschkiste/resources/**"
      - "test/**"
      - pyproject.toml
      - uv.lock

  # ── Web app ───────────────────────────────────────────────────────────────────

  webapp-lint:
    command: npm --prefix packages/webapp run lint
    stage: lint
    inputs: &webapp_inputs
      - "packages/webapp/src/**"
      - "packages/webapp/e2e/**"
      - "packages/webapp/public/**"
      - "packages/webapp/index.html"
      - "packages/webapp/kiosk.html"
      - "packages/webapp/package.json"
      - "packages/webapp/package-lock.json"
      - "packages/webapp/vite.config.js"
      - "packages/webapp/eslint.config.*"

  webapp-test:
    # After the containers: the timeouts of these tests do not survive a loaded machine.
    command: npm --prefix packages/webapp test
    stage: test
    depends_on:
      - test-py311
      - test-py313
      - test-py314
    inputs: *webapp_inputs

  webapp-e2e:
    # Needs a Playwright browser (`npx playwright install chromium`). The run rewrites the documentation
    # screenshots; they are restored afterwards.
    command: sh -c 'npm --prefix packages/webapp run test:e2e -- --workers=2; rc=$?; git checkout -q documentation/assets; exit $rc'
    stage: test
    depends_on:
      - webapp-test
    inputs: *webapp_inputs

  # ── Docs ──────────────────────────────────────────────────────────────────────

  wheels:
    command: ci/build_wheels.sh
    inputs:
      - "packages/**/*.py"
      - "packages/*/pyproject.toml"
      - "packages/plugins/*/pyproject.toml"
      - "packages/webapp/src/**"
      - "packages/lauschkiste/src/lauschkiste/resources/**"
    outputs:
      - dist/

  docs:
    command: uv run pydoc-markdown
    inputs:
      - "packages/lauschkiste/src/**/*.py"
      - "packages/plugins/**/*.py"
      - "packages/cli/src/**/*.py"
      - pydoc-markdown.yml
    outputs:
      - documentation/developers/docstring/

  markdownlint:
    command: packages/webapp/node_modules/.bin/markdownlint-cli2 --config .markdownlint-cli2.yaml "#node_modules"
    stage: lint
    inputs:
      - "**/*.md"
      - .markdownlint-cli2.yaml

  # ── Local dev ─────────────────────────────────────────────────────────────────

  build:
    # Builds the webapp's production bundle into packages/webapp/build/, which
    # lauschkiste.api.webapp_static serves directly on :5556 (see fastapi_server.py) -- so after
    # this, `uv run lauschkiste` alone (no separate `npm start`) gives you the full app, API +
    # UI, on one port. No hot-reload though: re-run this after webapp changes; for active
    # frontend development, `cd packages/webapp && npm run dev` is still the right tool.
    # Needs `cd packages/webapp && npm install` once first.
    command: npm --prefix packages/webapp run build
    stage: build
    inputs:
      - "packages/webapp/src/**"
      - "packages/webapp/public/**"
      - "packages/webapp/index.html"
      - "packages/webapp/package.json"
      - "packages/webapp/package-lock.json"
      - "packages/webapp/vite.config.js"
    outputs:
      - packages/webapp/build/

  # ── Aggregate CI ──────────────────────────────────────────────────────────────

  ci-checks:
    command: echo "All CI checks passed"
    stage: build
    depends_on:
      - lint
      - markdownlint
      - test-py311
      - test-py313
      - test-py314
      - webapp-lint
      - webapp-test
      - webapp-e2e

ci:
  provider: github-actions
  python_version: "3.11"
  triggers:
    push:
      branches: [main]
    pull_request:
