name: Wheels and install

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Web App
        uses: ./.github/actions/build-webapp

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: '3.13'

      - name: Check tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('packages/lauschkiste/pyproject.toml','rb'))['project']['version'])")
          if [ "v${VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match packages/lauschkiste version ${VERSION}"
            exit 1
          fi

      - name: Build wheels
        run: SKIP_WEBAPP_BUILD=1 ci/build_wheels.sh dist

      - name: Install the wheels into a fresh environment and start Lauschkiste
        run: |
          sudo apt-get update && sudo apt-get install -y libportaudio2
          uv venv /tmp/wheelenv
          uv pip install --python /tmp/wheelenv/bin/python dist/*.whl
          export LAUSCHKISTE_HOME=/tmp/lauschkiste-home
          cd /tmp
          /tmp/wheelenv/bin/lauschctl home
          /tmp/wheelenv/bin/lauschkiste &
          for i in $(seq 1 60); do curl -fsS localhost:5556/api/v1/health && break; sleep 1; done
          curl -fsS localhost:5556/ | grep -q '<div id="root">'
          curl -fsS localhost:5556/api/v1/modules
          kill %1

      - uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: dist/*.whl
          if-no-files-found: error

  install:
    name: 'install.sh (package, ${{ matrix.codename }})'
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        codename: [trixie, bookworm]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: wheels
          path: dist

      - name: Install from the wheels in a fresh Debian container and start Lauschkiste
        run: ci/test_install.sh ${{ matrix.codename }} --wheels dist

  install-source:
    name: 'install.sh (source, trixie)'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Web App
        uses: ./.github/actions/build-webapp

      - name: Install from this checkout in a fresh Debian container and start Lauschkiste
        run: ci/test_install.sh trixie --source

  release:
    needs: [build, install, install-source]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheels
          path: dist

      - name: Attach the wheels to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
