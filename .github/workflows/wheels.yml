name: Wheels and install

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      publish_testpypi:
        description: 'Publish this ref to TestPyPI (every upload needs a new version, e.g. 0.1.0a4.dev1)'
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build Web App
        uses: ./.github/actions/build-webapp

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: '3.13'

      - name: Check tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # v0.1.0-alpha.1 matches 0.1.0a1 (PEP 440 normalization)
          uv run --no-project --with packaging python - <<'PYTHON'
          import os, sys, tomllib
          from packaging.version import Version
          tag = os.environ['GITHUB_REF_NAME']
          version = tomllib.load(open('packages/lauschkiste/pyproject.toml', 'rb'))['project']['version']
          if Version(tag.lstrip('v')) != Version(version):
              sys.exit(f"::error::Tag {tag} does not match packages/lauschkiste version {version}")
          PYTHON

      - name: Build wheels
        run: SKIP_WEBAPP_BUILD=1 ci/build_wheels.sh dist

      - name: Install the wheels into a fresh environment and start Lauschkiste
        run: |
          sudo apt-get update && sudo apt-get install -y libportaudio2
          uv venv /tmp/wheelenv
          uv pip install --python /tmp/wheelenv/bin/python dist/*.whl
          export LAUSCHKISTE_HOME=/tmp/lauschkiste-home
          cd /tmp
          /tmp/wheelenv/bin/lauschctl home
          /tmp/wheelenv/bin/lauschkiste &
          for i in $(seq 1 60); do curl -fsS localhost:5556/api/v1/health && break; sleep 1; done
          curl -fsS localhost:5556/ | grep -q '<div id="root">'
          curl -fsS localhost:5556/api/v1/modules
          kill %1

      - name: Check the distributions' metadata
        run: uvx twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  install:
    name: 'install.sh (package, ${{ matrix.codename }})'
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        codename: [trixie, bookworm]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Install from the wheels in a fresh Debian container and start Lauschkiste
        run: ci/test_install.sh ${{ matrix.codename }} --wheels dist

  install-index:
    name: 'install.sh (package index, trixie)'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Install from a package index made of the distributions, as from PyPI
        run: ci/test_install.sh trixie --index dist

  install-source:
    name: 'install.sh (source, trixie)'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build Web App
        uses: ./.github/actions/build-webapp

      - name: Install from this checkout in a fresh Debian container and start Lauschkiste
        run: ci/test_install.sh trixie --source

  release:
    needs: [build, install, install-source]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Attach the wheels to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
          # Pre-release tags have the form v0.1.0-alpha.1
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true

  publish-testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'workflow_dispatch' && inputs.publish_testpypi
    needs: [build, install, install-index]
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-pypi:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, install, install-index, install-source, release]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
