name: Test Build Web App v3

on:
  schedule:
    # run at 18:00 every sunday
    - cron: '0 18 * * 0'
  # Version 3 branches inherit this workflow, so their names are unrestricted.
  push:
  workflow_dispatch:
  pull_request:
    # Keep PR checks scoped to the integration branches.
    branches:
        - develop
        - main
    paths:
        - '.github/workflows/test_build_webapp_v3.yml'
        - '.github/actions/build-webapp/**'
        - 'packages/webapp/**'

permissions:
  contents: read

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Web App
        uses: ./.github/actions/build-webapp

      - name: Lint Web App
        working-directory: ./packages/webapp
        run: npm run lint

      - name: Test Web App
        working-directory: ./packages/webapp
        run: npm test

      - name: Install Playwright browser
        working-directory: ./packages/webapp
        run: npx playwright install --with-deps chromium

      - name: Test Web App in Chromium
        working-directory: ./packages/webapp
        run: npm run test:e2e
