version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    ignore:
      # av 19 needs Python 3.12; Raspberry Pi OS Bookworm has 3.11
      - dependency-name: "av"
        versions: [">=19"]

  - package-ecosystem: "npm"
    directory: "/packages/webapp"
    schedule:
      interval: "monthly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"

  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "monthly"
