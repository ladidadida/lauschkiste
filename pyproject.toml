[tool.uv.workspace]
members = ["packages/*", "packages/plugins/*"]
# webapp is a Node/Vite project, not a Python package -- can't be a uv workspace member (uv
# workspaces are PEP 621/Python-only). It still lives under packages/ structurally, alongside the
# Python packages.
exclude = ["packages/webapp", "packages/plugins"]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov",
  "coverage",
  "mock",
  "httpx",  # for starlette.testclient (FastAPI API server tests)
  "ruff>=0.6",
  "pyright>=1.1.414",
  "pydoc-markdown",
  "bam-tool",
]

[tool.pytest.ini_options]
addopts = "--maxfail=2 -rf --ff -v --import-mode=importlib"
testpaths = ["test"]

[tool.coverage.run]
omit = ["test/*"]

[tool.pydoc-markdown]
loaders = [{ type = "python", search_path = ["./packages/lauschkiste/src"] }]
processors = [{ type = "filter" }, { type = "sphinx" }, { type = "crossref" }]

[tool.pydoc-markdown.renderer]
type = "markdown"
render_toc = true
filename = "./documentation/developers/docstring/README.md"
render_page_title = true

[tool.ruff]
line-length = 127
target-version = "py311"
extend-exclude = [
  "scratch*",
  "*/lauschkiste/nv_manager.py",  # not ported/linted yet, matches the old flake8 exclusion
  "**/node_modules",
  "**/rc522_spi/pirc522",  # third-party code, kept as published
]

[tool.ruff.lint]
# Mirrors the previous flake8 rule set (E, F, W, C90/mccabe) as closely as possible rather than
# also turning on isort ("I") / pyupgrade ("UP"): this codebase has never been run through either,
# and doing so here would create an unrelated few-thousand-line formatting backlog. Follow-up
# decision, not done in this pass.
select = ["E", "F", "W", "C90"]
# E126/E127/E128 (continuation line indent), W503 (line break before binary operator), and F824
# (unused global/nonlocal) were ignored under flake8 but aren't implemented by ruff at all
# (unknown-rule error if listed) -- nothing to ignore for them here.

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.11"
include = ["packages/lauschkiste/src", "packages/cli/src", "packages/plugins"]
exclude = [
  "**/node_modules",
  "**/__pycache__",
  "**/rc522_spi/pirc522",
  "**/scratch*",
  ".venv",
  "packages/lauschkiste/src/lauschkiste/nv_manager.py",
]
